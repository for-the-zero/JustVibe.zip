<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>颜文字拼装器 · Kaomoji Builder</title>
<style>
:root{
  --pink:#ff6f9c; --pink-deep:#f0497f; --pink-soft:#ffd9e8; --pink-faint:#fff0f6;
  --purple:#8b7cf6; --purple-soft:#e8e4ff;
  --ink:#3d3244; --muted:#a294ad; --line:#f3dfe9;
  --kao:"Yu Gothic UI","Hiragino Sans","Hiragino Kaku Gothic ProN","Yu Gothic","Meiryo","MS PGothic","Noto Sans CJK JP","Noto Sans SC",system-ui,sans-serif;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
html,body{margin:0;padding:0;}
body{
  font-family:var(--kao); color:var(--ink);
  background:linear-gradient(160deg,#fff5f8 0%,#f6f1ff 45%,#eef6ff 100%);
  min-height:100vh;
}
/* 背景水印 */
#bg{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:0;}
#bg span{position:absolute;opacity:.07;font-family:var(--kao);font-weight:bold;color:var(--pink-deep);white-space:nowrap;}

header{
  position:relative;z-index:2;
  display:flex;align-items:center;gap:14px;flex-wrap:wrap;
  padding:14px 22px;
  background:rgba(255,255,255,.75);backdrop-filter:blur(10px);
  border-bottom:1px solid var(--line);
}
.logo{font-family:var(--kao);font-size:30px;color:var(--pink-deep);transform:rotate(-6deg);text-shadow:0 3px 0 var(--pink-soft);}
.titles{display:flex;flex-direction:column;margin-right:auto;}
h1{font-size:21px;margin:0;letter-spacing:1px;}
.sub{font-size:12px;color:var(--muted);}
nav.tabs{display:flex;gap:6px;background:#fff;border:1px solid var(--line);padding:4px;border-radius:999px;box-shadow:0 2px 8px rgba(240,73,127,.08);}
nav.tabs button{
  border:0;background:transparent;color:var(--ink);font-family:inherit;
  padding:7px 16px;border-radius:999px;font-size:14px;cursor:pointer;transition:.18s;
}
nav.tabs button.active{background:linear-gradient(120deg,var(--pink),var(--purple));color:#fff;box-shadow:0 3px 10px rgba(240,73,127,.35);}
nav.tabs .badge{display:inline-block;min-width:18px;padding:0 5px;border-radius:9px;background:var(--pink);color:#fff;font-size:11px;line-height:17px;margin-left:4px;}
.hact{display:flex;gap:8px;}
.btn{
  border:0;font-family:inherit;font-size:14px;cursor:pointer;border-radius:999px;
  padding:9px 18px;transition:.18s;display:inline-flex;align-items:center;gap:6px;
}
.btn-primary{background:linear-gradient(120deg,var(--pink),#ff9a76);color:#fff;box-shadow:0 4px 14px rgba(240,73,127,.35);}
.btn-primary:hover{transform:translateY(-1px);box-shadow:0 6px 18px rgba(240,73,127,.45);}
.btn-ghost{background:#fff;border:1px solid var(--line);color:var(--ink);}
.btn-ghost:hover{border-color:var(--pink);color:var(--pink-deep);}
.btn:active{transform:scale(.96);}

main{position:relative;z-index:1;max-width:1060px;margin:0 auto;padding:18px 16px 60px;}
.card{
  background:rgba(255,255,255,.86);border:1px solid var(--line);border-radius:20px;
  padding:18px;box-shadow:0 8px 30px rgba(180,120,160,.10);margin-bottom:16px;
}
.card h2{margin:0 0 12px;font-size:15px;color:var(--ink);letter-spacing:.5px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;}
.card h2 .cnt{font-size:12px;color:var(--muted);font-weight:normal;}

/* ===== 预览 ===== */
.preview-card{background:linear-gradient(135deg,rgba(255,240,246,.95),rgba(240,236,255,.95));}
.pv-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;font-size:13px;color:var(--muted);}
.pv-tools .spacer{flex:1;}
.pv-tools label{display:inline-flex;align-items:center;gap:5px;cursor:pointer;user-select:none;}
.sizebtn{width:30px;height:30px;border-radius:50%;border:1px solid var(--line);background:#fff;cursor:pointer;font-family:inherit;color:var(--ink);font-size:13px;}
.sizebtn:hover{border-color:var(--pink);}
#preview{
  font-family:var(--kao);text-align:center;padding:26px 10px;margin:10px 0;
  font-size:38px;line-height:1.5;word-break:break-all;user-select:all;cursor:pointer;
  background:rgba(255,255,255,.6);border:2px dashed var(--pink-soft);border-radius:16px;min-height:100px;
  display:flex;align-items:center;justify-content:center;transition:border-color .2s;
}
#preview:hover{border-color:var(--pink);}
#preview.bump{animation:bump .28s ease;}
@keyframes bump{0%{transform:scale(1)}35%{transform:scale(1.06)}100%{transform:scale(1)}}
.pv-foot{display:flex;gap:8px;align-items:center;flex-wrap:wrap;}
#faceInput{
  flex:1;min-width:160px;font-family:var(--kao);font-size:15px;padding:9px 12px;border-radius:12px;
  border:1px solid var(--line);background:#fff;color:var(--ink);outline:none;
}
#faceInput:focus{border-color:var(--pink);}
#faceLen{font-size:12px;color:var(--muted);}

/* ===== 拼装台槽位 ===== */
#slotRow{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;}
.slot{
  position:relative;min-width:66px;padding:7px 8px 6px;border-radius:14px;cursor:pointer;
  border:1.6px dashed #e9c4d6;background:#fff;transition:.15s;text-align:center;
}
.slot:hover{border-color:var(--pink);transform:translateY(-2px);box-shadow:0 5px 14px rgba(240,73,127,.15);}
.slot.filled{border-style:solid;border-color:var(--pink);background:var(--pink-faint);}
.slot.ghost{background:#fffdf4;}
.slot-label{display:block;font-size:10.5px;color:var(--muted);letter-spacing:.5px;}
.slot-val{display:block;font-family:var(--kao);font-size:19px;line-height:1.5;min-height:29px;word-break:break-all;}
.slot.filled .slot-val{color:var(--pink-deep);}
.slot.ghost .slot-val{color:#d9c9a8;}
.slot-btns{position:absolute;top:-9px;right:-6px;display:flex;gap:3px;opacity:0;transition:.15s;}
.slot:hover .slot-btns,.slot:focus-within .slot-btns{opacity:1;}
.mini{
  width:21px;height:21px;border-radius:50%;border:0;cursor:pointer;font-size:10px;line-height:1;
  background:#fff;box-shadow:0 2px 6px rgba(0,0,0,.15);display:flex;align-items:center;justify-content:center;
}
.mini:hover{background:var(--pink);color:#fff;}
.lists{display:flex;gap:14px;flex-wrap:wrap;margin-top:14px;font-size:13px;align-items:center;}
.lists .lname{color:var(--muted);font-size:12px;}
.chiprow{display:flex;flex-wrap:wrap;gap:6px;align-items:center;min-height:30px;}
.chip{
  display:inline-flex;align-items:center;gap:5px;background:var(--purple-soft);color:var(--ink);
  border-radius:999px;padding:3px 6px 3px 10px;font-family:var(--kao);font-size:15px;
}
.chip .x{border:0;background:rgba(0,0,0,.08);width:17px;height:17px;border-radius:50%;cursor:pointer;font-size:10px;line-height:1;color:var(--ink);}
.chip .x:hover{background:var(--pink);color:#fff;}
.chip.flankchip{cursor:pointer;background:#fff;border:1px solid var(--line);font-size:13px;padding:4px 12px;}
.chip.flankchip.active{background:linear-gradient(120deg,var(--pink),var(--purple));color:#fff;border-color:transparent;}
.none{color:#cbbfd4;font-size:12px;}

/* ===== 情绪速拼 ===== */
#presetRow{display:flex;flex-wrap:wrap;gap:8px;}
.preset{
  border:1px solid var(--line);background:#fff;border-radius:14px;padding:8px 14px;cursor:pointer;
  font-family:inherit;font-size:14px;color:var(--ink);transition:.15s;
}
.preset:hover{border-color:var(--pink);background:var(--pink-faint);transform:translateY(-2px);box-shadow:0 5px 12px rgba(240,73,127,.15);}
.preset b{font-weight:600;}

/* ===== 组件库 ===== */
.lib-head{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:10px;}
#libSearch{
  font-family:inherit;font-size:14px;padding:8px 14px;border-radius:999px;border:1px solid var(--line);
  outline:none;min-width:170px;background:#fff;
}
#libSearch:focus{border-color:var(--pink);}
#libTabs{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;}
.pill{
  border:1px solid var(--line);background:#fff;border-radius:999px;padding:6px 14px;cursor:pointer;
  font-family:inherit;font-size:13px;color:var(--ink);transition:.15s;
}
.pill:hover{border-color:var(--pink);}
.pill.active{background:linear-gradient(120deg,var(--pink),var(--purple));color:#fff;border-color:transparent;box-shadow:0 3px 10px rgba(240,73,127,.3);}
#libMode{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;min-height:0;}
.modepill{border:1px dashed var(--line);background:#fffdf7;border-radius:999px;padding:4px 12px;cursor:pointer;font-family:inherit;font-size:12px;color:var(--muted);}
.modepill.active{border-style:solid;border-color:var(--purple);color:var(--purple);background:var(--purple-soft);}
#libGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(82px,1fr));gap:8px;max-height:400px;overflow-y:auto;padding:4px 2px;}
.comp{
  border:1px solid #f3e3ec;background:#fff;border-radius:13px;padding:8px 4px;cursor:pointer;text-align:center;
  font-family:inherit;transition:.13s;display:flex;flex-direction:column;gap:3px;align-items:center;justify-content:center;
}
.comp:hover{border-color:var(--pink);background:var(--pink-faint);transform:translateY(-2px);box-shadow:0 4px 10px rgba(240,73,127,.14);}
.comp:active{transform:scale(.94);}
.comp .ch{font-family:var(--kao);font-size:20px;line-height:1.4;word-break:break-all;color:var(--ink);}
.comp .d{font-size:10px;color:var(--muted);line-height:1.3;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
.empty{grid-column:1/-1;text-align:center;color:var(--muted);padding:26px 0;font-size:14px;}
.hint{font-size:12px;color:var(--muted);}

/* ===== 图鉴 ===== */
.gbar{display:flex;gap:10px;flex-wrap:wrap;align-items:center;margin-bottom:14px;}
#gSearch{flex:1;min-width:180px;font-family:inherit;font-size:14px;padding:9px 14px;border-radius:12px;border:1px solid var(--line);outline:none;background:#fff;}
#gSearch:focus{border-color:var(--pink);}
#gMood{font-family:inherit;font-size:14px;padding:9px 10px;border-radius:12px;border:1px solid var(--line);background:#fff;color:var(--ink);outline:none;cursor:pointer;}
#galleryGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:12px;}
.gcard{
  background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:16px;padding:12px;
  display:flex;flex-direction:column;gap:6px;transition:.15s;
}
.gcard:hover{transform:translateY(-3px);box-shadow:0 8px 20px rgba(180,120,160,.18);border-color:var(--pink-soft);}
.gface{
  border:0;background:transparent;font-family:var(--kao);font-size:21px;line-height:1.5;word-break:break-all;
  color:var(--ink);cursor:pointer;text-align:center;padding:8px 2px;border-radius:10px;
}
.gface:hover{background:var(--pink-faint);color:var(--pink-deep);}
.gdesc{font-size:12px;color:var(--muted);text-align:center;min-height:16px;}
.gmeta{display:flex;gap:4px;justify-content:center;flex-wrap:wrap;}
.tag{font-size:10.5px;background:var(--purple-soft);color:var(--purple);border-radius:999px;padding:2px 9px;}
.tag.pink{background:var(--pink-faint);color:var(--pink-deep);}
.gbtns{display:flex;gap:6px;}
.gbtns button{
  flex:1;border:1px solid var(--line);background:#fff;border-radius:9px;padding:5px 4px;cursor:pointer;
  font-family:inherit;font-size:12px;color:var(--ink);transition:.15s;
}
.gbtns button:hover{border-color:var(--pink);color:var(--pink-deep);background:var(--pink-faint);}

/* ===== 收藏 ===== */
#savedGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}
.scard{position:relative;background:rgba(255,255,255,.9);border:1px solid var(--line);border-radius:14px;padding:10px;}
.sface{
  width:100%;border:0;background:transparent;font-family:var(--kao);font-size:19px;word-break:break-all;
  color:var(--ink);cursor:pointer;text-align:center;padding:8px 4px;line-height:1.5;
}
.sface:hover{color:var(--pink-deep);}
.sx{position:absolute;top:4px;right:4px;width:20px;height:20px;border-radius:50%;border:0;background:rgba(0,0,0,.05);cursor:pointer;font-size:10px;color:var(--ink);}
.sx:hover{background:var(--pink);color:#fff;}
.shead{display:flex;align-items:center;justify-content:space-between;gap:10px;}
.shead h2{margin:0;}

footer{position:relative;z-index:1;text-align:center;color:var(--muted);font-size:12px;padding:10px 16px 30px;}

#toast{
  position:fixed;left:50%;bottom:34px;transform:translateX(-50%) translateY(20px);
  background:var(--ink);color:#fff;font-family:var(--kao);font-size:15px;
  padding:11px 22px;border-radius:999px;opacity:0;pointer-events:none;transition:.25s;z-index:99;
  box-shadow:0 10px 30px rgba(0,0,0,.25);max-width:90vw;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

@media (max-width:640px){
  header{padding:10px 14px;gap:10px;}
  .titles{margin-right:0;}
  h1{font-size:18px;}
  #preview{font-size:30px;}
  .slot{min-width:60px;}
}
</style>
</head>
<body>
<div id="bg"></div>

<header>
  <div class="logo">(◕‿◕)</div>
  <div class="titles">
    <h1>颜文字拼装器</h1>
    <span class="sub" id="subTitle">加载中…</span>
  </div>
  <nav class="tabs">
    <button data-page="build" class="active">🧩 拼装台</button>
    <button data-page="gallery">📖 图鉴</button>
    <button data-page="saved">⭐ 收藏<span class="badge" id="savedCount">0</span></button>
  </nav>
  <div class="hact">
    <button class="btn btn-primary" id="btnRandom">🎲 随机拼一个</button>
    <button class="btn btn-ghost" id="btnClear">🧹 清空</button>
  </div>
</header>

<main>
  <!-- ============ 拼装台 ============ -->
  <section id="page-build">
    <div class="card preview-card">
      <div class="pv-tools">
        <span>字号</span>
        <button class="sizebtn" id="sizeDown">－</button>
        <button class="sizebtn" id="sizeUp">＋</button>
        <span class="spacer"></span>
        <label><input type="checkbox" id="autoFrame" checked> 自动脸框 ( )</label>
      </div>
      <div id="preview" title="点击整行可全选复制">(´ω`)</div>
      <div class="pv-foot">
        <input id="faceInput" readonly value="">
        <span id="faceLen"></span>
        <button class="btn btn-primary" id="btnCopy">📋 复制</button>
        <button class="btn btn-ghost" id="btnStar">⭐ 收藏</button>
      </div>
    </div>

    <div class="card">
      <h2>🧩 拼装台 <span class="hint">点击槽位直达对应组件分类 · 悬停槽位可单独随机/清除</span></h2>
      <div id="slotRow"></div>
      <div class="lists">
        <span class="lname">道具</span>
        <div class="chiprow" id="propChips"></div>
        <span class="lname">尾饰</span>
        <div class="chiprow" id="tailChips"></div>
        <span class="lname">环绕</span>
        <div class="chiprow" id="flankChips"></div>
      </div>
    </div>

    <div class="card">
      <h2>🎭 情绪速拼 <span class="hint">一键按情绪随机换脸</span></h2>
      <div id="presetRow"></div>
    </div>

    <div class="card">
      <h2>📚 组件库 <span class="cnt" id="libCount"></span></h2>
      <div class="lib-head">
        <input id="libSearch" placeholder="🔍 搜索组件（如：猫、泪、星）">
      </div>
      <div id="libTabs"></div>
      <div id="libMode"></div>
      <div id="libGrid"></div>
    </div>
  </section>

  <!-- ============ 图鉴 ============ -->
  <section id="page-gallery" hidden>
    <div class="card">
      <h2>📖 颜文字图鉴 <span class="cnt" id="gCount"></span></h2>
      <div class="gbar">
        <input id="gSearch" placeholder="🔍 搜索颜文字 / 描述 / 标签…">
        <select id="gMood"><option value="">全部情绪</option></select>
      </div>
    </div>
    <div id="galleryGrid"></div>
  </section>

  <!-- ============ 收藏 ============ -->
  <section id="page-saved" hidden>
    <div class="card">
      <div class="shead">
        <h2>⭐ 我的收藏</h2>
        <button class="btn btn-ghost" id="btnClearSaved">清空收藏</button>
      </div>
      <div class="hint" id="savedHint">点击颜文字即可复制</div>
    </div>
    <div id="savedGrid"></div>
  </section>
</main>

<footer>数据来源：kaomoji_library.json（<span id="ftComps"></span> 组件 / <span id="ftKm"></span> 颜文字）· 纯前端单文件，可离线使用</footer>
<div id="toast"></div>

const BONUS_HANDS = [['ฅ','animal_ears','cat','猫爪·两侧','cat,cute']];

const SLOTS = [
 {key:'headwear',label:'头饰',tab:'headwear'},
 {key:'leftArm',label:'左手',tab:'arms'},
 {key:'leftEar',label:'左脸框',tab:'frame'},
 {key:'leftTear',label:'左泪汗',tab:'sweat_tear'},
 {key:'leftCheek',label:'左脸颊',tab:'cheek'},
 {key:'leftEye',label:'左眼',tab:'eyes'},
 {key:'mouth',label:'嘴巴',tab:'mouth'},
 {key:'rightEye',label:'右眼',tab:'eyes'},
 {key:'rightCheek',label:'右脸颊',tab:'cheek'},
 {key:'rightTear',label:'右泪汗',tab:'sweat_tear'},
 {key:'rightEar',label:'右脸框',tab:'frame'},
 {key:'rightArm',label:'右手',tab:'arms'},
];

/* ================= 状态 ================= */
const state = {headwear:'',leftArm:'',rightArm:'',leftEar:'',rightEar:'',leftTear:'',rightTear:'',
 leftCheek:'',rightCheek:'',leftEye:'',rightEye:'',mouth:'',props:[],tail:[],flank:'',autoFrame:true,size:38};
const modes = {eye:'both',arm:'auto',hand:'both',cheek:'both'};
let activeTab = 'eyes', libQuery = '', currentItems = [], currentKM = [];
let SAVED = loadSaved();

/* ================= 工具 ================= */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
const rnd = n => Math.floor(Math.random()*n);
const rndPick = a => a && a.length ? a[rnd(a.length)] : '';
const isEmojiChar = ch => { const cp = ch.codePointAt(0); return cp >= 0x1F000 || (cp >= 0x2600 && cp <= 0x27BF) || (cp >= 0xFE00 && cp <= 0xFE0F) || cp >= 0x1F300; };
function pushUnique(arr, v, max){ if (arr.includes(v)) return; if (arr.length >= max) arr.shift(); arr.push(v); }
function weightedPick(arr, wf){ let sum = 0; const ws = arr.map(x => { const w = wf(x); sum += w; return w; });
  let r = Math.random()*sum; for (let i = 0; i < arr.length; i++){ r -= ws[i]; if (r <= 0) return arr[i]; } return arr[arr.length-1]; }
const compsOf = part => COMPS.filter(c => c[1] === part);
const POOLS = {};
function poolOf(part){ if (!POOLS[part]) POOLS[part] = [...new Set(compsOf(part).map(c => c[0]))]; return POOLS[part]; }
const CHEEK_CHARS = new Set(poolOf('cheek'));
const EYE_SET = new Set(poolOf('eyes'));

function loadSaved(){ try { return JSON.parse(localStorage.getItem('kaomoji_saved')) || []; } catch(e){ return []; } }
function persist(){ try { localStorage.setItem('kaomoji_saved', JSON.stringify(SAVED.slice(0, 80))); } catch(e){} }

/* ================= 拼装核心 ================= */
function buildFace(){
  let le = state.leftEar, re = state.rightEar;
  if (state.autoFrame && !le && !re){ le = '('; re = ')'; }
  let propsStr = '';
  if (state.props.length){
    propsStr = state.props.join('');
    if (isEmojiChar(state.props[0])) propsStr = ' ' + propsStr;
  }
  let s = state.headwear + state.leftArm + le + state.leftTear + state.leftCheek + state.leftEye
    + state.mouth + state.rightEye + state.rightCheek + state.rightTear + re + state.rightArm
    + propsStr + state.tail.join('');
  const f = FLANKS[state.flank];
  if (f) s = f[0] + s + f[1];
  return s;
}

function pickComp(part, tags, subs){
  tags = tags || []; subs = subs || [];
  const pool = compsOf(part);
  if (!pool.length) return null;
  let cand = pool.filter(c => (c[4] && c[4].split(',').some(t => tags.includes(t))) || subs.includes(c[2]));
  if (!cand.length) cand = pool.filter(c => subs.includes(c[2]));
  if (!cand.length) return null;
  return cand[rnd(cand.length)][0];
}

function routeArm(c){
  const sub = c[2];
  if (sub === 'left') state.leftArm = c[0];
  else if (sub === 'right') state.rightArm = c[0];
  else { state.leftArm = c[0]; state.rightArm = MIRROR[c[0]] || c[0]; }
}

function clearSlots(){
  ['headwear','leftArm','rightArm','leftEar','rightEar','leftTear','rightTear','leftCheek','rightCheek',
   'leftEye','rightEye','mouth'].forEach(k => state[k] = '');
  state.props = []; state.tail = []; state.flank = '';
}

function applyPreset(p){
  clearSlots();
  const eye = pickComp('eyes', p.eyeTags, p.eyeSub) || rndPick(FALLBACK.eyes);
  state.leftEye = eye; state.rightEye = MIRROR[eye] || eye;
  state.mouth = pickComp('mouth', p.mouthTags, p.mouthSub) || rndPick(FALLBACK.mouth);
  const fr = rndPick(FRAME_CORE); state.leftEar = fr[0]; state.rightEar = fr[1];
  if (p.armP && Math.random() < p.armP){
    const pool = compsOf('arms').filter(c => c[4] && c[4].split(',').some(t => (p.armTags || ['wave','raise','hug']).includes(t)));
    routeArm(rndPick(pool.length ? pool : compsOf('arms')));
  }
  if (p.cheekP && Math.random() < p.cheekP){
    const ch = pickComp('cheek', p.cheekTags, ['blush','heart','flower']) || '*';
    state.leftCheek = ch; state.rightCheek = ch;
  }
  if (p.tearP && Math.random() < p.tearP){
    const t = rndPick([';','；',"'",'´','`','T']);
    state.leftTear = t; state.rightTear = t;
  }
  if (p.tailP && Math.random() < p.tailP) state.tail = [pickComp('magic', p.tailTags, ['sparkle']) || '✧'];
  if (p.flankP && Math.random() < p.flankP) state.flank = rndPick(['star','shine','music','flower','wave']);
  if (p.propP && Math.random() < p.propP){
    const pr = pickComp('props', p.propTags || ['party','drink','food'], ['drink','food','party']);
    if (pr) state.props = [pr];
  }
  render();
}

function randomAll(){
  applyPreset(weightedPick(PRESETS, p => p.w || 1));
  if (Math.random() < 0.08) state.headwear = rndPick(poolOf('headwear'));
  render();
}

function randomSlot(key){
  switch(key){
    case 'leftEye': state.leftEye = rndPick(poolOf('eyes')); break;
    case 'rightEye': state.rightEye = rndPick(poolOf('eyes')); break;
    case 'mouth': state.mouth = rndPick(poolOf('mouth').concat(['ω'])); break;
    case 'leftArm': state.leftArm = rndPick(poolOf('arms')); break;
    case 'rightArm': state.rightArm = rndPick(poolOf('arms')); break;
    case 'leftCheek': state.leftCheek = rndPick(poolOf('cheek')); break;
    case 'rightCheek': state.rightCheek = rndPick(poolOf('cheek')); break;
    case 'leftTear': state.leftTear = rndPick(poolOf('sweat_tear')); break;
    case 'rightTear': state.rightTear = rndPick(poolOf('sweat_tear')); break;
    case 'leftEar': case 'rightEar': { const f = rndPick(FRAME_CORE); state.leftEar = f[0]; state.rightEar = f[1]; break; }
    case 'headwear': state.headwear = rndPick(poolOf('headwear')); break;
  }
  render();
}

/* 组件分配 */
function assignFromLib(c){
  const char = c[0], part = c[1], sub = c[2];
  switch(part){
    case 'eyes':
      if (modes.eye === 'left') state.leftEye = char;
      else if (modes.eye === 'right') state.rightEye = char;
      else { state.leftEye = char; state.rightEye = MIRROR[char] || char; }
      break;
    case 'mouth': state.mouth = char; break;
    case 'arms':
      if (modes.arm === 'left') state.leftArm = char;
      else if (modes.arm === 'right') state.rightArm = char;
      else if (sub === 'left') state.leftArm = char;
      else if (sub === 'right') state.rightArm = char;
      else { state.leftArm = char; state.rightArm = MIRROR[char] || char; }
      break;
    case 'hands':
      if (modes.hand === 'left') state.leftArm = char;
      else if (modes.hand === 'right') state.rightArm = char;
      else { state.leftArm = MIRROR[char] || char; state.rightArm = char; }
      break;
    case 'cheek':
      if (modes.cheek === 'left') state.leftCheek = char;
      else if (modes.cheek === 'right') state.rightCheek = char;
      else { state.leftCheek = char; state.rightCheek = char; }
      break;
    case 'sweat_tear':
      if (';；\'´`T'.includes(char)){ state.leftTear = char; state.rightTear = char; }
      else state.rightTear = char;
      break;
    case 'animal_ears':
      if (MIRROR[char] && OPENERS.has(char)){ state.leftEar = char; state.rightEar = MIRROR[char]; }
      else if (MIRROR[char]) state.mouth = char;
      else state.mouth = char;
      break;
    case 'headwear': state.headwear = (state.headwear === char) ? '' : char; break;
    case 'decoration':
      if (OPENERS.has(char)) state.leftEar = char;
      else if (CLOSERS.has(char)) state.rightEar = char;
      else pushUnique(state.tail, char, 6);
      break;
    case 'magic': pushUnique(state.tail, char, 6); break;
    case 'props': pushUnique(state.props, char, 3); break;
    case 'symbols': pushUnique(state.props, char, 3); break;
  }
  render();
}

function setFramePair(l, r){ state.leftEar = l; state.rightEar = r; render(); }

/* ================= 渲染 ================= */
function bumpEl(el){ el.classList.remove('bump'); void el.offsetWidth; el.classList.add('bump'); }

function render(){
  const face = buildFace();
  const pv = $('#preview');
  pv.textContent = face;
  pv.style.fontSize = state.size + 'px';
  bumpEl(pv);
  $('#faceInput').value = face;
  $('#faceLen').textContent = face.length + ' 字符';
  renderSlots(); renderChips(); updateSavedCount();
}

function renderSlots(){
  const ghost = state.autoFrame && !state.leftEar && !state.rightEar;
  $('#slotRow').innerHTML = SLOTS.map(s => {
    const v = state[s.key];
    const isEar = s.key === 'leftEar' || s.key === 'rightEar';
    const disp = v || (isEar && ghost ? (s.key === 'leftEar' ? '(' : ')') : '');
    return '<div class="slot ' + (v ? 'filled' : '') + (isEar && ghost && !v ? ' ghost' : '') + '" data-key="' + s.key + '" tabindex="0">'
      + '<span class="slot-label">' + s.label + '</span>'
      + '<span class="slot-val">' + (disp ? esc(disp) : '&nbsp;') + '</span>'
      + '<span class="slot-btns"><button class="mini" data-act="rand" title="随机">🎲</button>'
      + '<button class="mini" data-act="clear" title="清除">✕</button></span></div>';
  }).join('');
}

function renderChips(){
  const mk = (list, key) => list.length
    ? list.map((p, i) => '<span class="chip">' + esc(p)
        + '<button class="x" data-list="' + key + '" data-i="' + i + '">✕</button></span>').join('')
    : '<span class="none">无</span>';
  $('#propChips').innerHTML = mk(state.props, 'props');
  $('#tailChips').innerHTML = mk(state.tail, 'tail');
  $('#flankChips').innerHTML = FLANK_LIST.map(f =>
    '<span class="chip flankchip ' + (state.flank === f[0] ? 'active' : '') + '" data-flank="' + f[0] + '">' + f[1] + '</span>').join('');
}

function updateSavedCount(){ $('#savedCount').textContent = SAVED.length; }

function renderLib(){
  $('#libTabs').innerHTML = PART_TABS.map(t =>
    '<button class="pill ' + (activeTab === t.id ? 'active' : '') + '" data-tab="' + t.id + '">' + t.label + '</button>').join('');
  renderLibModes(); renderLibGrid();
}

function renderLibModes(){
  const MODE_SETS = {
    eyes:['eye','双眼对称','只设左眼','只设右眼'],
    arms:['arm','按组件方向','只设左手','只设右手'],
    hands:['hand','两侧同款','只设左手','只设右手'],
    cheek:['cheek','两侧同款','只左脸颊','只右脸颊']};
  const VALS = ['both','left','right'];
  const set = MODE_SETS[activeTab];
  let html = '';
  if (set){
    html = '<span class="hint">放置：</span>' + set.slice(1).map((lab, i) =>
      '<button class="modepill ' + (modes[set[0]] === VALS[i] || (set[0] === 'arm' && modes.arm === 'auto' && i === 0) ? 'active' : '')
      + '" data-mkey="' + set[0] + '" data-mval="' + (set[0] === 'arm' && i === 0 ? 'auto' : VALS[i]) + '">' + lab + '</button>').join('');
  }
  $('#libMode').innerHTML = html;
}

function renderLibGrid(){
  let items = [];
  if (activeTab === 'frame'){
    items = FRAME_PAIRS.map(p => ({ch: p[0] + '  ' + p[1], d: p[2], act: () => setFramePair(p[0], p[1])}));
    items.push({ch: '␀', d: '无脸框', act: () => { state.leftEar = ''; state.rightEar = ''; render(); }});
  } else {
    let list = compsOf(activeTab);
    if (activeTab === 'mouth') list = list.concat(BONUS_MOUTH);
    if (activeTab === 'hands') list = list.concat(BONUS_HANDS);
    if (libQuery){
      const q = libQuery.toLowerCase();
      list = list.filter(c => (c[0] + ' ' + c[2] + ' ' + c[3] + ' ' + c[4]).toLowerCase().includes(q));
    }
    const seen = new Set();
    items = list.filter(c => { const k = c[0] + '|' + c[1] + '|' + c[2]; if (seen.has(k)) return false; seen.add(k); return true; })
      .map(c => ({ch: c[0], d: c[3], act: () => assignFromLib(c)}));
  }
  currentItems = items;
  $('#libGrid').innerHTML = items.map((it, i) =>
    '<button class="comp" data-i="' + i + '" title="' + esc(it.d) + '">'
    + '<span class="ch">' + esc(it.ch) + '</span><span class="d">' + esc(it.d || '') + '</span></button>').join('')
    || '<div class="empty">没有匹配的组件 (´･_･`)</div>';
}

function renderGallery(){
  const q = $('#gSearch').value.trim().toLowerCase();
  const mood = $('#gMood').value;
  currentKM = KM.filter(k => {
    if (mood && k[1] !== mood) return false;
    if (q && !((k[0] + ' ' + k[1] + ' ' + k[2] + ' ' + k[3] + ' ' + k[4]).toLowerCase().includes(q))) return false;
    return true;
  });
  $('#gCount').textContent = currentKM.length + ' / ' + KM.length;
  $('#galleryGrid').innerHTML = currentKM.map((k, i) =>
    '<div class="gcard"><button class="gface" data-i="' + i + '" title="点击复制">' + esc(k[0]) + '</button>'
    + '<div class="gdesc">' + esc(k[4] || '') + '</div>'
    + '<div class="gmeta"><span class="tag pink">' + esc(MOOD_CN[k[1]] || k[1]) + '</span>'
    + (k[2] ? '<span class="tag">' + esc(k[2]) + '</span>' : '') + '</div>'
    + '<div class="gbtns"><button data-act="copy" data-i="' + i + '">📋 复制</button>'
    + '<button data-act="draft" data-i="' + i + '">🧩 拆为底稿</button></div></div>').join('')
    || '<div class="empty" style="grid-column:1/-1">没有匹配的颜文字 (。•́︿•̀。)</div>';
}

function renderSaved(){
  $('#savedGrid').innerHTML = SAVED.length
    ? SAVED.map((f, i) => '<div class="scard"><button class="sface" data-i="' + i + '" title="点击复制">' + esc(f) + '</button>'
        + '<button class="sx" data-i="' + i + '">✕</button></div>').join('')
    : '<div class="empty" style="grid-column:1/-1">还没有收藏，去拼一个吧 (๑•̀ㅂ•́)و✧</div>';
}

function loadAsDraft(k){
  clearSlots();
  const p = k[5] || {};
  const le = p.left_eye || '', re = p.right_eye || '', m = p.mouth || '';
  if (le) { if (OPENERS.has(le)) state.leftEar = le; else state.leftEye = le; }
  if (re) { if (CLOSERS.has(re)) state.rightEar = re; else state.rightEye = re; }
  const bracketed = OPENERS.has(le) && CLOSERS.has(re);
  if (m && !(OPENERS.has(m) || CLOSERS.has(m))){
    const arr = [...m];
    let split = false;
    if (arr.length === 3 && EYE_SET.has(arr[0]) && EYE_SET.has(arr[2])){
      state.leftEye = arr[0]; state.mouth = arr[1]; state.rightEye = arr[2]; split = true;
    } else if (arr.length === 2 && EYE_SET.has(arr[0]) && EYE_SET.has(arr[1])){
      state.leftEye = arr[0]; state.rightEye = arr[1]; split = true;
    } else if (arr.length <= 4){
      state.mouth = m;
    }
    // 从原脸字符串里扫描嘴两侧的字符，尝试补全眼睛（如 ヽ(◕ヮ◕)ﾉ 的 parts 只有 mouth=ヮ）
    if (!split && bracketed && state.mouth){
      const idx = k[0].indexOf(state.mouth);
      if (idx > 0){
        const before = k[0][idx - 1], after = k[0][idx + [...state.mouth].length];
        if (EYE_SET.has(before) && EYE_SET.has(after)){
          state.leftEye = before; state.rightEye = after;
        }
      }
    }
  }
  if (p.decoration){
    const d = p.decoration, arr = [...d];
    if (arr.length === 1){
      if (CHEEK_CHARS.has(d)){ state.leftCheek = d; state.rightCheek = d; }
      else if (OPENERS.has(d)) state.leftEar = d;
      else if (CLOSERS.has(d)) state.rightEar = d;
      else state.tail = [d];
    } else if (arr.length <= 8) state.tail = [d];
  }
  if (p.hand){
    const arr = [...p.hand];
    if (arr.length >= 2){ state.leftArm = arr[0]; state.rightArm = arr[arr.length-1]; }
    else if (arr.length === 1) state.rightArm = arr[0];
  }
  if (p.item) state.props = [p.item];
  if (!state.leftEye && !state.mouth && !state.rightEye){ /* 兜底 */
    state.leftEye = '´'; state.rightEye = '`'; state.mouth = 'ω';
  }
  render();
}

/* ================= 复制 / 收藏 / 提示 ================= */
let toastTimer = null;
function toast(msg){
  const t = $('#toast'); t.textContent = msg; t.classList.add('show');
  clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 1800);
}

async function copyText(txt){
  if (!txt){ toast('先拼一个再复制嘛 (｡•̀ᴗ-)✧'); return; }
  try { await navigator.clipboard.writeText(txt); toast('已复制 ' + txt); return; } catch(e){}
  try {
    const ta = document.createElement('textarea');
    ta.value = txt; ta.style.cssText = 'position:fixed;opacity:0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy'); ta.remove();
    if (ok){ toast('已复制 ' + txt); return; }
  } catch(e){}
  const inp = $('#faceInput'); inp.focus(); inp.select();
  toast('浏览器拦截了复制，请按 Ctrl+C');
}

function saveFace(face){
  if (!face) return;
  SAVED = SAVED.filter(f => f !== face);
  SAVED.unshift(face);
  SAVED = SAVED.slice(0, 80);
  persist(); updateSavedCount();
  if (!$('#page-saved').hidden) renderSaved();
}

/* ================= 事件 ================= */
function switchPage(page){
  ['build','gallery','saved'].forEach(p => { $('#page-' + p).hidden = (p !== page); });
  document.querySelectorAll('nav.tabs button').forEach(b => b.classList.toggle('active', b.dataset.page === page));
  if (page === 'gallery') renderGallery();
  if (page === 'saved') renderSaved();
  window.scrollTo({top: 0, behavior: 'smooth'});
}

function openTab(tab){
  activeTab = tab; libQuery = ''; $('#libSearch').value = '';
  renderLib();
  const grid = $('#libGrid');
  if (grid) grid.scrollIntoView({behavior: 'smooth', block: 'nearest'});
}

function wire(){
  document.querySelectorAll('nav.tabs button').forEach(b => b.addEventListener('click', () => switchPage(b.dataset.page)));
  $('#btnRandom').addEventListener('click', () => { randomAll(); toast('新出炉 → ' + buildFace()); });
  $('#btnClear').addEventListener('click', () => { clearSlots(); render(); toast('已清空，重新开始拼吧'); });
  $('#btnCopy').addEventListener('click', () => { copyText(buildFace()); saveFace(buildFace()); });
  $('#btnStar').addEventListener('click', () => { saveFace(buildFace()); toast('已收藏 ⭐'); });
  $('#btnClearSaved').addEventListener('click', () => { SAVED = []; persist(); renderSaved(); updateSavedCount(); toast('收藏已清空'); });
  $('#preview').addEventListener('click', () => { const r = document.createRange(); r.selectNodeContents($('#preview')); const s = getSelection(); s.removeAllRanges(); s.addRange(r); });
  $('#autoFrame').addEventListener('change', e => { state.autoFrame = e.target.checked; render(); });
  $('#sizeUp').addEventListener('click', () => { state.size = Math.min(72, state.size + 4); render(); });
  $('#sizeDown').addEventListener('click', () => { state.size = Math.max(18, state.size - 4); render(); });

  /* 槽位交互 */
  $('#slotRow').addEventListener('click', e => {
    const mini = e.target.closest('.mini');
    const slot = e.target.closest('.slot');
    if (!slot) return;
    const key = slot.dataset.key;
    if (mini){
      if (mini.dataset.act === 'rand') randomSlot(key);
      else { state[key] = ''; render(); }
      return;
    }
    const def = SLOTS.find(s => s.key === key);
    openTab(def.tab);
    if (key === 'leftEye'){ modes.eye = 'left'; }
    else if (key === 'rightEye'){ modes.eye = 'right'; }
    else if (key === 'leftArm'){ modes.arm = 'left'; }
    else if (key === 'rightArm'){ modes.arm = 'right'; }
    else if (key === 'leftCheek'){ modes.cheek = 'left'; }
    else if (key === 'rightCheek'){ modes.cheek = 'right'; }
    renderLibModes();
  });

  /* 道具/尾饰/环绕 */
  document.body.addEventListener('click', e => {
    const x = e.target.closest('.chip .x');
    if (x){ state[x.dataset.list].splice(+x.dataset.i, 1); render(); return; }
    const fl = e.target.closest('.flankchip');
    if (fl){ state.flank = fl.dataset.flank; render(); return; }
  });

  /* 情绪速拼 */
  $('#presetRow').innerHTML = PRESETS.map((p, i) =>
    '<button class="preset" data-i="' + i + '">' + p.emoji + ' <b>' + p.label + '</b></button>').join('');
  $('#presetRow').addEventListener('click', e => {
    const b = e.target.closest('.preset');
    if (b){ applyPreset(PRESETS[+b.dataset.i]); }
  });

  /* 组件库 */
  $('#libTabs').addEventListener('click', e => {
    const t = e.target.closest('[data-tab]');
    if (t){ activeTab = t.dataset.tab; renderLib(); }
  });
  $('#libMode').addEventListener('click', e => {
    const m = e.target.closest('[data-mkey]');
    if (m){ modes[m.dataset.mkey] = m.dataset.mval; renderLibModes(); }
  });
  $('#libGrid').addEventListener('click', e => {
    const c = e.target.closest('.comp');
    if (c && currentItems[+c.dataset.i]) currentItems[+c.dataset.i].act();
  });
  $('#libSearch').addEventListener('input', e => { libQuery = e.target.value.trim(); renderLibGrid(); });

  /* 图鉴 */
  const moods = {}; KM.forEach(k => { moods[k[1]] = (moods[k[1]] || 0) + 1; });
  $('#gMood').innerHTML = '<option value="">全部情绪</option>' +
    Object.entries(moods).sort((a, b) => b[1] - a[1]).map(([m, n]) =>
      '<option value="' + esc(m) + '">' + esc(MOOD_CN[m] || m) + '（' + n + '）</option>').join('');
  $('#gSearch').addEventListener('input', renderGallery);
  $('#gMood').addEventListener('change', renderGallery);
  $('#galleryGrid').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.classList.contains('gface')){ const k = currentKM[+b.dataset.i]; copyText(k[0]); saveFace(k[0]); return; }
    const k = currentKM[+b.dataset.i];
    if (b.dataset.act === 'copy'){ copyText(k[0]); saveFace(k[0]); }
    else if (b.dataset.act === 'draft'){ loadAsDraft(k); switchPage('build'); toast('已拆为底稿，继续改装吧 🧩'); }
  });

  /* 收藏 */
  $('#savedGrid').addEventListener('click', e => {
    const b = e.target.closest('button');
    if (!b) return;
    if (b.classList.contains('sface')) copyText(SAVED[+b.dataset.i]);
    else if (b.classList.contains('sx')){ SAVED.splice(+b.dataset.i, 1); persist(); renderSaved(); updateSavedCount(); }
  });
}

/* ================= 启动 ================= */
function init(){
  $('#subTitle').textContent = COMPS.length + ' 个组件 · ' + KM.length + ' 个图鉴颜文字 · 无限组合';
  $('#ftComps').textContent = COMPS.length;
  $('#ftKm').textContent = KM.length;
  $('#libCount').textContent = '共 ' + COMPS.length + ' 个组件';
  // 背景水印
  const marks = ['ヽ(◕ヮ◕)ﾉ✧','(≧▽≦)','(╯°□°）╯︵ ┻━┻','(づ｡◕‿‿◕｡)づ','(っ˘̩╭╮˘̩)っ','ʕ•ᴥ•ʔ','( ˘ ³˘)♥','♪(´▽｀)','Σ(°△°|||)','(¬‿¬)','(/Header)'.replace('Header','T▽T'),'☆*:.｡.o(≧▽≦)o.｡.:*☆'];
  $('#bg').innerHTML = marks.map((m, i) => {
    const top = (i * 19 + 6) % 92, left = (i * 37 + 4) % 88, size = 22 + (i * 13) % 34;
    return '<span style="top:' + top + '%;left:' + left + '%;font-size:' + size + 'px">' + esc(m) + '</span>';
  }).join('');
  // 初始示例
  state.leftEar = '('; state.rightEar = ')'; state.leftEye = '´'; state.rightEye = '`'; state.mouth = 'ω';
  wire();
  renderLib();
  render();
  updateSavedCount();
}
init();
</script>
