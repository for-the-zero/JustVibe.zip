<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>触控映射</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-touch-callout: none;
      -webkit-user-select: none;
      user-select: none;
    }
    
    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background: #1a1a2e;
      touch-action: none;
    }
    
    #touchArea {
      width: 100%;
      height: 100%;
      position: relative;
    }
    
    #status {
      position: fixed;
      top: 10px;
      left: 50%;
      transform: translateX(-50%);
      padding: 8px 16px;
      background: rgba(0,0,0,0.5);
      border-radius: 20px;
      color: #fff;
      font-size: 14px;
      font-family: sans-serif;
      z-index: 100;
      display: flex;
      align-items: center;
      gap: 8px;
    }
    
    #status .dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #ff4444;
    }
    
    #status.connected .dot {
      background: #44ff44;
    }
    
    .touch-point {
      position: fixed;
      width: 80px;
      height: 80px;
      border-radius: 50%;
      background: rgba(100, 100, 255, 0.3);
      border: 3px solid rgba(100, 100, 255, 0.8);
      pointer-events: none;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 24px;
      color: #fff;
      font-family: sans-serif;
      font-weight: bold;
      z-index: 50;
    }
    
    #hint {
      position: fixed;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.3);
      font-size: 12px;
      font-family: sans-serif;
    }
  </style>
</head>
<body>
  <div id="touchArea"></div>
  <div id="status">
    <div class="dot"></div>
    <span id="statusText">连接中...</span>
  </div>
  <div id="hint">点击任意位置触发按键</div>

  <script>
    let ws = null;
    let isConnected = false;
    const activeTouches = new Map();

    function connect() {
      const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
      ws = new WebSocket(`${protocol}//${location.host}/ws`);
      
      ws.onopen = () => {
        isConnected = true;
        document.getElementById('status').classList.add('connected');
        document.getElementById('statusText').textContent = '已连接';
      };
      
      ws.onclose = () => {
        isConnected = false;
        document.getElementById('status').classList.remove('connected');
        document.getElementById('statusText').textContent = '重连中...';
        setTimeout(connect, 2000);
      };
      
      ws.onerror = () => {
        document.getElementById('statusText').textContent = '连接错误';
      };
    }

    function send(type, touchId) {
      if (!isConnected) return;
      ws.send(JSON.stringify({ type, touchId }));
    }

    function createIndicator(touchId, x, y) {
      const el = document.createElement('div');
      el.className = 'touch-point';
      el.style.left = x + 'px';
      el.style.top = y + 'px';
      el.textContent = touchId;
      document.body.appendChild(el);
      return el;
    }

    function updateIndicator(el, x, y) {
      el.style.left = x + 'px';
      el.style.top = y + 'px';
    }

    function removeIndicator(el) {
      el.parentNode?.removeChild(el);
    }

    const area = document.getElementById('touchArea');
    
    area.addEventListener('touchstart', (e) => {
      e.preventDefault();
      for (const touch of e.changedTouches) {
        const id = touch.identifier;
        if (activeTouches.has(id)) continue;
        
        const indicator = createIndicator(id, touch.clientX, touch.clientY);
        activeTouches.set(id, { indicator, x: touch.clientX, y: touch.clientY });
        send('touchstart', id);
      }
    }, { passive: false });

    area.addEventListener('touchmove', (e) => {
      e.preventDefault();
      for (const touch of e.changedTouches) {
        const data = activeTouches.get(touch.identifier);
        if (data) {
          updateIndicator(data.indicator, touch.clientX, touch.clientY);
        }
      }
    }, { passive: false });

    area.addEventListener('touchend', (e) => {
      e.preventDefault();
      for (const touch of e.changedTouches) {
        const id = touch.identifier;
        const data = activeTouches.get(id);
        if (data) {
          removeIndicator(data.indicator);
          activeTouches.delete(id);
          send('touchend', id);
        }
      }
    }, { passive: false });

    area.addEventListener('touchcancel', (e) => {
      e.preventDefault();
      for (const touch of e.changedTouches) {
        const id = touch.identifier;
        const data = activeTouches.get(id);
        if (data) {
          removeIndicator(data.indicator);
          activeTouches.delete(id);
          send('touchend', id);
        }
      }
    }, { passive: false });

    // 防止缩放
    document.addEventListener('gesturestart', e => e.preventDefault());
    document.addEventListener('dblclick', e => e.preventDefault());

    // 页面隐藏时释放所有触控
    document.addEventListener('visibilitychange', () => {
      if (document.hidden) {
        for (const [id, data] of activeTouches) {
          removeIndicator(data.indicator);
          send('touchend', id);
        }
        activeTouches.clear();
      }
    });

    connect();
  </script>
</body>
</html>
